name: Rust

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            arch: aarch64
            name: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            arch: x86_64
            name: darwin-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            arch: aarch64
            name: darwin-aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            arch: x86_64
            name: win32-x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            arch: aarch64
            name: win32-aarch64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.target }}

      - name: Build
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.name }}
          BIN_NAME=odoo_ls_server
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp server/target/${{ matrix.target }}/release/${BIN_NAME}.exe artifacts/${{ matrix.name }}/
            cp server/target/${{ matrix.target }}/release/${BIN_NAME}.pdb artifacts/${{ matrix.name }}/ || true
          else
            cp server/target/${{ matrix.target }}/release/${BIN_NAME} artifacts/${{ matrix.name }}/
          fi
        continue-on-error: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MINOR=$(echo "$TAG" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 1 ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "title=$TAG - Beta" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog entry
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk "/^## \\[1.0.1\\]/ {flag=1; next} /^## \\[/ {flag=0} flag {print}" changelog.md > RELEASE_NOTES.md

      - name: Zip all artifacts
        shell: bash
        run: |
          for dir in artifacts/*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            TAG="${GITHUB_REF_NAME}"
            zip -j artifacts/odoo-${name}-${TAG}.zip $dir/*
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.title }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          files: ./artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

